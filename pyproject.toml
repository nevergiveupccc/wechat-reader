[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wechat-reader-mcp"
version = "0.1.0"
description = "Discover and read public WeChat Official Account articles through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "markdownify>=0.13,<2",
  "mcp[cli]>=1.10,<2",
  "platformdirs>=4,<5",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
]

[project.scripts]
wechat-reader-mcp = "wechat_reader_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_reader_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in network smoke tests"]

